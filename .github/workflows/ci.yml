name: Integración continua

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verificar:
    name: Verificar el panel
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código con lint
        run: npm run lint

      - name: Ejecutar las pruebas
        run: npm test

      - name: Compilar el panel
        run: npm run build

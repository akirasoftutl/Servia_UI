<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Registro de negocio</title>
<desc id="descripcion">Boceto de baja fidelidad del panel del negocio. MVP-02. Los controles representan acciones; los ejemplos y estados alternativos no ocurren a la vez.</desc>
<rect width="1280" height="800" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#222222">
<rect x="0" y="0" width="1280" height="64" fill="#eeeeee" stroke="#777777"/>
<text x="28" y="40" font-size="24" font-weight="bold">Servia · Panel del negocio</text>
<text x="910" y="39" font-size="18">Boceto · Datos de ejemplo</text>
<text x="350" y="115" font-size="28" font-weight="bold">Registro de negocio</text>
<text x="350" y="146" font-size="16">MVP-02</text>
<text x="350" y="780" font-size="14">Wireframe estático · Cajas y controles sin implementación</text>
<text x="350" y="188" font-size="17" font-weight="bold">Nombre del negocio *</text>
<rect x="350" y="198" width="580" height="36" fill="#ffffff" stroke="#777777"/>
<text x="360" y="222" font-size="16"></text>
<text x="350" y="254" font-size="15">Escribe el nombre del negocio.</text>
<text x="350" y="275" font-size="17" font-weight="bold">Correo *</text>
<rect x="350" y="285" width="580" height="36" fill="#ffffff" stroke="#777777"/>
<text x="360" y="309" font-size="16"></text>
<text x="350" y="341" font-size="15">Escribe un correo válido. Si ya está registrado, usa otro.</text>
<text x="350" y="362" font-size="17" font-weight="bold">Teléfono *</text>
<rect x="350" y="372" width="580" height="36" fill="#ffffff" stroke="#777777"/>
<text x="360" y="396" font-size="16"></text>
<text x="350" y="428" font-size="15">El teléfono es obligatorio.</text>
<text x="350" y="449" font-size="17" font-weight="bold">Contraseña *</text>
<rect x="350" y="459" width="580" height="36" fill="#ffffff" stroke="#777777"/>
<text x="360" y="483" font-size="16">••••••••</text>
<text x="350" y="515" font-size="15">Usa al menos 8 caracteres.</text>
<a href="03-perfil-del-negocio.svg">
<rect x="350" y="538" width="580" height="38" fill="#eeeeee" stroke="#777777"/>
<text x="362" y="563" font-size="17">Registrarme y completar el perfil</text>
</a>
<rect x="350" y="599" width="580" height="75" fill="#f5f5f5" stroke="#777777"/>
<text x="366" y="625" font-size="16">Al terminar: Registro exitoso. Tu sesión queda iniciada.</text>
<text x="366" y="651" font-size="16">Completa tu perfil para publicar servicios.</text>
<a href="02-inicio-de-sesion.svg">
<rect x="350" y="696" width="580" height="38" fill="#eeeeee" stroke="#777777"/>
<text x="362" y="721" font-size="17">Ya tengo cuenta · Iniciar sesión</text>
</a>
</g>
</svg>

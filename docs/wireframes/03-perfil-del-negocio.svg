<text x="256" y="353" font-size="17" font-weight="bold">Teléfono *</text>
<rect x="256" y="363" width="460" height="36" fill="#ffffff" stroke="#777777"/>
<text x="266" y="387" font-size="16">477 000 0000</text>
<text x="748" y="353" font-size="17" font-weight="bold">Correo de contacto *</text>
<rect x="748" y="363" width="484" height="36" fill="#ffffff" stroke="#777777"/>
